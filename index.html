<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Black Hole</title>
<style>
  :root {
    --bg: #000;
    --panel: rgba(12, 14, 20, 0.78);
    --text: #e6e8ee;
    --muted: #8a90a0;
    --accent: #ffb054;
    --line: rgba(255, 255, 255, 0.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden;
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  canvas.dragging { cursor: grabbing; }
  #panel { position: fixed; top: 16px; left: 16px; width: 260px; max-width: calc(100vw - 32px);
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px;
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #panel h1 { font-size: 14px; margin: 0 0 2px; letter-spacing: 0.02em; }
  #panel p { margin: 0 0 10px; color: var(--muted); font-size: 12px; }
  #panel.collapsed .body { display: none; }
  .row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 8px; margin: 8px 0; }
  .row label { color: var(--muted); }
  .row output { font-variant-numeric: tabular-nums; color: var(--text); }
  .row input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); }
  .check { display: flex; align-items: center; gap: 8px; margin: 6px 0; color: var(--muted); }
  .check input { accent-color: var(--accent); }
  header { display: flex; justify-content: space-between; align-items: start; gap: 8px; }
  button { background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: 6px;
    padding: 2px 8px; cursor: pointer; font: inherit; }
  button:hover { color: var(--text); }
  #stats { position: fixed; right: 16px; bottom: 16px; color: var(--muted); font-size: 12px;
    font-variant-numeric: tabular-nums; text-align: right; pointer-events: none; }
  .modes { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0; margin: 4px 0 10px;
    border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .modes label { text-align: center; padding: 5px 0; cursor: pointer; color: var(--muted); }
  .modes input { position: absolute; opacity: 0; pointer-events: none; }
  .modes label:has(input:checked) { background: rgba(255, 176, 84, 0.18); color: var(--text); }
  .modes label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
  #status, #starStatus { color: var(--text); margin: 6px 0 2px; font-variant-numeric: tabular-nums; }
  .header-buttons { display: flex; gap: 6px; flex-shrink: 0; }
  #music[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
  #restart { width: 100%; padding: 5px 8px; margin-top: 4px; }
  #wave { position: fixed; right: 16px; bottom: 36px; width: 240px; max-width: calc(100vw - 32px);
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px 6px;
    pointer-events: none; }
  #wave div { color: var(--muted); font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; }
  #wave canvas { width: 100%; height: 56px; cursor: default; }
  #error { position: fixed; inset: 0; display: none; place-items: center; padding: 24px; text-align: center; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="panel">
  <header>
    <div>
      <h1>Black hole</h1>
      <p>Light rays bent by gravity, ray-traced live. Drag to orbit; scroll or pinch to zoom.</p>
    </div>
    <div class="header-buttons">
      <button id="music" aria-pressed="true" title="Background music: Misterio en el Agujero Negro">♪ On</button>
      <button id="toggle" aria-label="Collapse panel">–</button>
    </div>
  </header>
  <div class="body">
    <div class="modes" role="radiogroup" aria-label="Scene">
      <label><input type="radio" name="mode" id="modeSingle" value="single" checked> One hole</label>
      <label><input type="radio" name="mode" id="modeBinary" value="binary"> Two holes</label>
      <label><input type="radio" name="mode" id="modeStar" value="star"> Hole + star</label>
    </div>
    <div id="starControls" hidden>
      <div class="row"><label for="starMass">Star mass</label><output id="starMassOut"></output>
        <input id="starMass" type="range" min="0.3" max="1.5" step="0.05" value="0.6"></div>
      <div id="starStatus"></div>
    </div>
    <div id="binaryControls" hidden>
      <div class="row"><label for="q">Mass ratio</label><output id="qOut"></output>
        <input id="q" type="range" min="0.2" max="1" step="0.05" value="1"></div>
      <div id="status"></div>
      <button id="restart">Restart merger</button>
    </div>
    <div class="row"><label for="dist">Camera distance</label><output id="distOut"></output>
      <input id="dist" type="range" min="6" max="60" step="0.1" value="24"></div>
    <div class="row"><label for="incl">Camera inclination</label><output id="inclOut"></output>
      <input id="incl" type="range" min="-89" max="89" step="0.5" value="8"></div>
    <div class="row"><label for="diskOuter">Disk outer radius</label><output id="diskOuterOut"></output>
      <input id="diskOuter" type="range" min="4" max="20" step="0.1" value="12"></div>
    <div class="row"><label for="bright">Disk brightness</label><output id="brightOut"></output>
      <input id="bright" type="range" min="0.1" max="4" step="0.05" value="1.2"></div>
    <div class="row"><label for="speed">Time speed</label><output id="speedOut"></output>
      <input id="speed" type="range" min="0" max="4" step="0.05" value="1"></div>
    <div class="row"><label for="res">Render scale</label><output id="resOut"></output>
      <input id="res" type="range" min="0.25" max="1" step="0.05" value="0.6"></div>
    <label class="check"><input id="doppler" type="checkbox" checked> Doppler beaming &amp; redshift</label>
    <label class="check"><input id="lensing" type="checkbox" checked> Gravitational lensing</label>
    <label class="check"><input id="spin" type="checkbox" checked> Auto-orbit camera</label>
  </div>
</div>

<audio id="track" src="music.mp3" loop preload="auto"></audio>
<div id="wave" hidden><div>Gravitational-wave strain</div><canvas id="waveCanvas"></canvas></div>
<div id="stats"></div>
<div id="error">WebGL is not available in this browser, so the simulation cannot run.</div>

<script id="vs" type="x-shader/x-vertex">
attribute vec2 aPos;
void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
</script>

<script id="fs" type="x-shader/x-fragment">
precision highp float;

uniform vec2  uRes;
uniform float uTime;
uniform vec3  uCamPos;
uniform mat3  uCamRot;
uniform float uDiskIn;
uniform float uDiskOut;
uniform float uBright;
uniform float uDoppler;
uniform float uLensing;
uniform vec4  uHoleA;   // xyz position, w Schwarzschild radius
uniform vec4  uHoleB;   // w = 0 when there is only one hole
uniform float uMass;    // total mass the disk orbits
uniform vec3  uDiskCenter;
uniform vec4  uStar;       // xyz centre, w radius; w = 0 when there is no star
uniform vec4  uStarShape;  // xyz unit axis toward the hole, w how far the star stretches along it
uniform float uStarTemp;
uniform vec3  uStream[8];  // gas stream from the star to the disk, as a polyline
uniform float uStreamReach; // 0 when there is no stream
uniform float uArmStrength; // tidal spiral arms in the disk; 0 when there is no star

// Units: the final (or only) hole has rs = 1, so M = 0.5 and its photon sphere sits at r = 1.5.
const int   MAX_STEPS = 400;
const float ESCAPE_R  = 80.0;

float hash(vec3 p) {
  p = fract(p * 0.3183099 + 0.1);
  p *= 17.0;
  return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
}

float noise(vec3 x) {
  vec3 i = floor(x), f = fract(x);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash(i + vec3(0,0,0)), hash(i + vec3(1,0,0)), f.x),
                 mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
             mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x),
                 mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y), f.z);
}

float fbm(vec3 p) {
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 5; i++) { v += a * noise(p); p *= 2.03; a *= 0.5; }
  return v;
}

// Approximate blackbody colour for a temperature in kelvin.
vec3 blackbody(float t) {
  t = clamp(t, 1000.0, 40000.0) / 100.0;
  vec3 c;
  c.r = t <= 66.0 ? 1.0 : clamp(1.292936 * pow(t - 60.0, -0.1332047), 0.0, 1.0);
  c.g = t <= 66.0 ? clamp(0.3900816 * log(t) - 0.6318414, 0.0, 1.0)
                  : clamp(1.1298909 * pow(t - 60.0, -0.0755148), 0.0, 1.0);
  c.b = t >= 66.0 ? 1.0 : (t <= 19.0 ? 0.0 : clamp(0.5432068 * log(t - 10.0) - 1.1962541, 0.0, 1.0));
  return c;
}

vec3 starfield(vec3 d) {
  vec3 col = vec3(0.0);
  // Three layers of hashed cells on the sky sphere, each holding at most one star.
  for (int l = 0; l < 3; l++) {
    float scale = 90.0 + float(l) * 110.0;
    vec3 p = d * scale;
    vec3 cell = floor(p);
    float h = hash(cell + float(l) * 31.7);
    if (h > 0.965) {
      vec3 center = cell + 0.5 + 0.35 * (vec3(hash(cell + 1.3), hash(cell + 2.7), hash(cell + 4.1)) - 0.5);
      float dist = length(p - center);
      float mag = pow((h - 0.965) / 0.035, 3.0);
      vec3 tint = blackbody(3000.0 + 9000.0 * hash(cell + 7.7));
      col += tint * mag * smoothstep(0.35, 0.0, dist) * 2.5;
    }
  }
  // A faint band of galaxy-like haze.
  float band = exp(-pow(dot(d, normalize(vec3(0.3, 1.0, 0.2))) * 3.2, 2.0));
  float neb = fbm(d * 3.0 + 4.0);
  col += band * neb * vec3(0.10, 0.08, 0.13) + neb * neb * vec3(0.012, 0.014, 0.03);
  return col;
}

// Novikov-Thorne-like temperature profile: zero at the inner edge, peaking just outside it.
float diskTemp(float r) {
  float x = uDiskIn / max(r, uDiskIn);
  return pow(x, 0.75) * pow(max(1.0 - sqrt(x), 0.0), 0.25) / 0.488 * 5200.0;
}

// Glowing haze just above and below the disk, in the disk's colour at each radius,
// fading out past its edges. It is what makes the disk glow into the space around it.
vec3 diskHaze(vec3 pos) {
  vec3 rel = pos - uDiskCenter;
  float r = length(rel.xz);
  float fade = smoothstep(uDiskIn * 0.85, uDiskIn + 0.6, r) * (1.0 - smoothstep(uDiskOut * 0.9, uDiskOut * 1.35, r));
  if (fade <= 0.0) return vec3(0.0);
  float temp = diskTemp(clamp(r, uDiskIn + 0.3, uDiskOut));
  float glow = temp / 5200.0;
  return blackbody(temp) * glow * glow * exp(-abs(rel.y) / 0.7) * fade;
}

// Emission from the thin disk where the ray crosses y = 0 at radius r.
vec4 diskSample(vec3 hit, vec3 rayDir) {
  vec3 p = hit - uDiskCenter;
  float r = length(p.xz);
  if (r < uDiskIn || r > uDiskOut) return vec4(0.0);

  // Keplerian velocity v = sqrt(M / r), rotating counter-clockwise seen from +y.
  float v = sqrt(uMass / r);
  vec3 tangent = normalize(vec3(-p.z, 0.0, p.x));
  float gamma = 1.0 / sqrt(1.0 - v * v);
  float cosTheta = dot(tangent, -rayDir);
  float doppler = 1.0 / (gamma * (1.0 - v * cosTheta));
  float potential = uHoleA.w / length(hit - uHoleA.xyz);
  if (uHoleB.w > 0.0) potential += uHoleB.w / length(hit - uHoleB.xyz);
  float gravShift = sqrt(max(1.0 - potential, 0.0));
  float g = mix(1.0, doppler * gravShift, uDoppler);

  float temp = diskTemp(r);
  float phi = atan(p.z, p.x);

  // The star's tides drive two spiral shocks through the outer disk. The pattern is fixed
  // to the star and turns with the orbit while the gas streams through it. The arms trail:
  // they wind back against the disk's spin going outward (pitch about 17 degrees). Shocked
  // gas in the arms is compressed and heated; the gaps between them are thinner and dimmer.
  float arm = 0.0, armZone = 0.0;
  if (uArmStrength > 0.0) {
    float phiStar = atan(-uStarShape.z, -uStarShape.x);
    float a = phi - phiStar - 1.2 + 3.2 * log(r / uDiskOut);
    armZone = smoothstep(uDiskIn, uDiskIn + 0.45 * (uDiskOut - uDiskIn), r) * uArmStrength;
    arm = pow(0.5 + 0.5 * cos(2.0 * a), 5.0) * armZone;
    temp *= 1.0 + 0.3 * arm;
  }

  // Turbulent structure that shears with the orbital angular speed.
  float omega = v / r;
  float swirl = phi + uTime * omega * 4.0;
  vec3 q = vec3(cos(swirl) * r, sin(swirl) * r, r * 0.6);
  float turb = fbm(q * 1.2) * 0.75 + fbm(vec3(r * 3.0, swirl * 2.0, uTime * 0.05)) * 0.5;

  float edge = smoothstep(uDiskIn, uDiskIn + 0.6, r) * smoothstep(uDiskOut, uDiskOut - min(3.0, 0.3 * (uDiskOut - uDiskIn)), r);
  float intensity = temp / 5200.0;
  intensity = intensity * intensity * (0.15 + turb * turb * 1.4) * edge;
  intensity *= 1.0 - 0.55 * armZone + 2.6 * arm;

  vec3 col = blackbody(temp * g) * intensity * pow(g, 4.0) * uBright * 0.55;
  float alpha = clamp(intensity * 1.6 * (0.6 + turb), 0.0, 1.0);
  return vec4(col, alpha);
}

// Photon acceleration from one hole: a = -1.5 rs h^2 d / |d|^5, with h = |d x v|.
vec3 holeAccel(vec3 pos, vec3 dir, vec4 hole) {
  if (hole.w <= 0.0) return vec3(0.0);
  vec3 d = pos - hole.xyz;
  vec3 h = cross(d, dir);
  return -1.5 * hole.w * dot(h, h) * d / pow(length(d), 5.0);
}

// Step length near one hole: small close in, large far away, scaled to the hole's size.
float holeStep(float d, float rs) {
  if (rs <= 0.0) return 1e4;
  float n = d / rs;
  return 0.06 * rs * n * n / (1.0 + n);
}

// The star, stretched by the hole's tides into a teardrop that points at it.
// Returns the outward normal if p is inside, or a zero vector if not.
vec3 starNormal(vec3 p) {
  vec3 d = p - uStar.xyz;
  float along = dot(d, uStarShape.xyz);
  vec3 perp = d - along * uStarShape.xyz;
  float R = uStar.w;
  float Ra = along > 0.0 ? R * uStarShape.w : R;
  if ((along * along) / (Ra * Ra) + dot(perp, perp) / (R * R) > 1.0) return vec3(0.0);
  return normalize(perp / (R * R) + uStarShape.xyz * along / (Ra * Ra));
}

vec3 starSurface(vec3 n, vec3 rayDir) {
  vec3 axis = uStarShape.xyz;
  // Tidally locked, so the granulation is fixed in a frame that turns with the orbit.
  vec3 side = normalize(cross(axis, vec3(0.0, 1.0, 0.0)));
  vec3 local = vec3(dot(n, axis), n.y, dot(n, side));
  // Fine, low-contrast granulation: a hot star's surface boils in small cells.
  float gran = 0.85 + 0.3 * fbm(local * 22.0 + vec3(0.0, 0.0, uTime * 0.15));
  // Gravity darkening: the stretched side facing the hole is cooler.
  float temp = uStarTemp * (1.0 - 0.22 * max(dot(n, axis), 0.0));
  float mu = max(dot(n, -rayDir), 0.0);
  float limb = 1.0 - 0.5 * (1.0 - mu);
  // Deepen the tint, or tone mapping washes a hot star's blue out to plain white.
  vec3 c = blackbody(temp);
  return mix(c, c * c, 0.5) * limb * gran * 0.62;
}

// Gas in the stream from the inner Lagrange point to the disk. Returns the density and how
// far along the stream the point is (0 at L1, 1 where it has merged into the disk), and its halo.
// The stream lands on the rim at point 5, the hot spot, then flows on with the disk.
vec3 streamDensity(vec3 p) {
  float best = 1e4, bestS = 0.0;
  for (int k = 0; k < 7; k++) {
    vec3 a = uStream[k], b = uStream[k + 1];
    vec3 ab = b - a;
    float t = clamp(dot(p - a, ab) / dot(ab, ab), 0.0, 1.0);
    vec3 q = a + ab * t - p;
    float d2 = dot(q, q);
    if (d2 < best) { best = d2; bestS = (float(k) + t) / 7.0; }
  }
  // Narrow as it falls, then spreading out as it merges into the disk.
  float w = bestS < 0.7 ? mix(0.45, 0.3, bestS / 0.7) : mix(0.3, 0.7, (bestS - 0.7) / 0.3);
  float fade = 1.0 - smoothstep(0.75, 1.0, bestS);
  float rho = exp(-best / (w * w)) * mix(0.5, 1.2, min(bestS / 0.7, 1.0)) * fade;
  // A wide, faint halo around the core, so the stream glows into the space around it.
  float halo = exp(-best / (9.0 * w * w)) * fade;
  return vec3(rho, bestS, halo);
}

void main() {
  // Scale by the shorter side, so the scene fits on portrait screens as well as landscape ones.
  vec2 uv = (gl_FragCoord.xy - 0.5 * uRes) / min(uRes.x, uRes.y);
  vec3 dir = normalize(uCamRot * vec3(uv, 1.6));
  vec3 pos = uCamPos;

  vec3 col = vec3(0.0);
  float trans = 1.0;
  bool captured = false;
  bool hitStar = false;
  vec3 starGlow = blackbody(uStarTemp);
  // Closest the (bent) ray comes to the star's surface, for the halo added after the march.
  float starMiss = 1e4, starMissTrans = 1.0;

  for (int i = 0; i < MAX_STEPS; i++) {
    float r = length(pos);
    float dA = length(pos - uHoleA.xyz);
    float dB = length(pos - uHoleB.xyz);
    if (dA < uHoleA.w || dB < uHoleB.w) { captured = true; break; }
    if (r > ESCAPE_R && dot(pos, dir) > 0.0) break;

    if (uStar.w > 0.0) {
      vec3 n = starNormal(pos);
      if (dot(n, n) > 0.0) {
        col += trans * starSurface(n, normalize(dir));
        starMiss = 0.0;
        starMissTrans = trans;
        hitStar = true;
        break;
      }
    }

    float dt = clamp(min(holeStep(dA, uHoleA.w), holeStep(dB, uHoleB.w)), 0.01, 1.6);
    float rDisk = length(pos - uDiskCenter);
    if (abs(pos.y) < 1.0 && rDisk < max(uDiskOut, uStreamReach) + 2.0) dt = min(dt, 0.12);

    if (abs(pos.y) < 3.0 && rDisk < uDiskOut * 1.4 + 1.0)
      col += trans * diskHaze(pos) * dt * 0.04 * uBright;

    if (uStar.w > 0.0) {
      // Slow down near the star so rays do not step over its edge, and add its glow.
      float h = length(pos - uStar.xyz) - uStar.w * uStarShape.w;
      dt = min(dt, max(h * 0.7, 0.06));
      float hs = max(length(pos - uStar.xyz) - uStar.w, 0.0);
      if (hs < starMiss) { starMiss = hs; starMissTrans = trans; }
    }

    if (uStreamReach > 0.0 && abs(pos.y) < 2.5 && rDisk < uStreamReach + 2.5) {
      vec3 st = streamDensity(pos);
      float rho = st.x * (0.8 + 0.4 * noise(pos * 2.0 + uTime * 0.3));
      // The gas leaves at the temperature of the star's tip (its cooler, gravity-darkened
      // side), cools as it expands on the way down to the disk's colour at that radius,
      // and is heated again by the shock where it hits the rim.
      vec3 sp = uStream[5] - pos;
      float spot = exp(-dot(sp, sp) / 0.3);
      float rs = clamp(length((pos - uDiskCenter).xz), uDiskIn, uDiskOut);
      float temp = mix(uStarTemp * 0.78, diskTemp(rs), smoothstep(0.0, 0.45, st.y));
      temp *= 1.0 + 0.45 * spot;
      // Capped, so the thin, hot gas near the star does not outshine the disk.
      float glow = min(temp / 5200.0, 1.3);
      col += trans * blackbody(temp) * glow * glow * (rho + spot * 0.9 + st.z * 0.12) * dt * 0.7 * uBright;
      trans *= exp(-rho * dt * 0.6);
    }

    vec3 acc = (holeAccel(pos, dir, uHoleA) + holeAccel(pos, dir, uHoleB)) * uLensing;
    vec3 prev = pos;
    dir += acc * dt;
    pos += dir * dt;

    // Thin disk crossing.
    if (prev.y * pos.y < 0.0) {
      float t = prev.y / (prev.y - pos.y);
      vec3 hit = mix(prev, pos, t);
      vec4 d = diskSample(hit, normalize(dir));
      col += trans * d.rgb * d.a;
      trans *= 1.0 - d.a;
      if (trans < 0.02) break;
    }
  }

  if (!captured && !hitStar) col += trans * starfield(normalize(dir));

  // The star's halo: a bright corona hugging the surface and a wide, faint glow beyond it.
  // It follows the bent rays, so it is lensed by the hole like the star itself.
  if (uStar.w > 0.0) {
    float halo = exp(-starMiss / (0.12 * uStar.w)) * 0.55 + exp(-starMiss / (0.6 * uStar.w)) * 0.12;
    if (hitStar) halo *= 0.35;
    // Squaring the colour deepens its tint, so the glow reads as blue-white rather than grey.
    col += starMissTrans * mix(starGlow, starGlow * starGlow, 0.6) * halo;
  }

  // Gentle saturation boost, then filmic tone mapping and gamma.
  col = mix(vec3(dot(col, vec3(0.2126, 0.7152, 0.0722))), col, 1.35);
  col = max(col, 0.0);
  col = col * (2.51 * col + 0.03) / (col * (2.43 * col + 0.59) + 0.14);
  col = pow(clamp(col, 0.0, 1.0), vec3(1.0 / 2.2));
  gl_FragColor = vec4(col, 1.0);
}
</script>

<script id="blitfs" type="x-shader/x-fragment">
precision mediump float;
uniform sampler2D uTex;
uniform vec2 uRes;
void main() { gl_FragColor = texture2D(uTex, gl_FragCoord.xy / uRes); }
</script>

<script>
(() => {
  const canvas = document.getElementById('c');
  const gl = canvas.getContext('webgl', { antialias: false, preserveDrawingBuffer: true });
  if (!gl) { document.getElementById('error').style.display = 'grid'; return; }

  const $ = (id) => document.getElementById(id);

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  function program(vsId, fsId) {
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, $(vsId).textContent));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, $(fsId).textContent));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    return p;
  }

  const traceProg = program('vs', 'fs');
  const blitProg = program('vs', 'blitfs');

  const quad = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);

  const loc = (p, n) => gl.getUniformLocation(p, n);
  const U = {};
  for (const n of ['uRes', 'uTime', 'uCamPos', 'uCamRot', 'uDiskIn', 'uDiskOut', 'uBright', 'uDoppler', 'uLensing', 'uHoleA', 'uHoleB', 'uMass',
                   'uDiskCenter', 'uStar', 'uStarShape', 'uStarTemp', 'uStream', 'uStreamReach', 'uArmStrength'])
    U[n] = loc(traceProg, n);

  // Ray-trace into a low-resolution texture, then stretch it over the canvas.
  const tex = gl.createTexture();
  const fbo = gl.createFramebuffer();
  let lowW = 0, lowH = 0;

  const state = {
    yaw: 0.6,
    incl: 8,
    dist: 24,
    diskOuter: 12,
    bright: 1.2,
    speed: 1,
    res: 0.6,
    doppler: true,
    lensing: true,
    spin: true,
    mode: 'single',
    q: 1,
    starMass: 0.6,
  };

  const sliders = {
    dist: (v) => v.toFixed(1) + ' rs',
    incl: (v) => v.toFixed(0) + '°',
    diskOuter: (v) => v.toFixed(1) + ' rs',
    bright: (v) => v.toFixed(2) + '×',
    speed: (v) => v.toFixed(2) + '×',
    res: (v) => Math.round(v * 100) + '%',
    q: (v) => v.toFixed(2),
    // Shown in solar masses, taking the hole to be 10 of them.
    starMass: (v) => (v * 10).toFixed(1) + ' M☉',
  };
  for (const [key, fmt] of Object.entries(sliders)) {
    const input = $(key), out = $(key + 'Out');
    const sync = () => { state[key] = parseFloat(input.value); out.textContent = fmt(state[key]); };
    input.addEventListener('input', sync);
    sync();
  }
  for (const key of ['doppler', 'lensing', 'spin'])
    $(key).addEventListener('change', (e) => { state[key] = e.target.checked; });

  // Binary inspiral. Units have G = c = 1 and the merged hole at rs = 1 (M = 0.5).
  // The pair starts with 5% more mass; that 5% leaves as gravitational waves at merger.
  const RADIATED = 0.05;
  const M_PRE = 0.5 / (1 - RADIATED);
  const SEP_START = 4.5;
  const TIME_SCALE = 10; // simulation time units per second at 1× speed
  const binary = {};

  function resetBinary() {
    const m1 = M_PRE / (1 + state.q), m2 = M_PRE - m1;
    Object.assign(binary, {
      m1, m2, sep: SEP_START, phase: 0, merged: false, sinceMerge: 0,
      diskIn: 1.8 * SEP_START, mergeStrain: 0, mergeOmega: 0,
    });
    wave.fill(0);
  }

  // Peters' formula for the shrinking separation: da/dt = -(64/5) m1 m2 M / a^3.
  function stepBinary(dtUnits) {
    const b = binary, M = b.m1 + b.m2;
    if (!b.merged) {
      const n = Math.ceil(dtUnits / 0.05);
      for (let i = 0; i < n && !b.merged; i++) {
        const h = dtUnits / n;
        b.phase += Math.sqrt(M / b.sep ** 3) * h;
        b.sep -= (64 / 5) * b.m1 * b.m2 * M / b.sep ** 3 * h;
        if (b.sep <= 2 * M) {
          // The horizons touch: one hole remains.
          b.merged = true;
          b.mergeStrain = strain();
          b.mergeOmega = 2 * Math.sqrt(M / b.sep ** 3);
        }
      }
    } else {
      b.sinceMerge += dtUnits;
      // With the binary gone, the gas drifts in toward the new innermost stable orbit.
      b.diskIn += (3 - b.diskIn) * (1 - Math.exp(-dtUnits / 40));
    }
  }

  // Quadrupole strain, up to a constant: h ~ m1 m2 / a · cos(2φ), then an exponential ringdown.
  function strain() {
    const b = binary;
    if (!b.merged) return (b.m1 * b.m2 / b.sep) * Math.cos(2 * b.phase);
    const t = b.sinceMerge;
    return b.mergeStrain * Math.exp(-t / 4) * Math.cos(b.mergeOmega * 1.6 * t);
  }

  // A hole with a companion star, like an X-ray binary. The hole keeps rs = 1 (M = 0.5);
  // the star's mass is a multiple of that. The star fills its Roche lobe, so gas spills
  // through the inner Lagrange point and streams onto the hole's disk.
  const STAR_SEP = 20;
  const STAR_ORBIT_SPEEDUP = 3; // the real orbit would take minutes to watch
  const starSys = { phase: 0 };

  // Eggleton's fit for the Roche-lobe radius, as a fraction of the separation.
  const rocheLobe = (q) => {
    const q3 = Math.cbrt(q), q23 = q3 * q3;
    return 0.49 * q23 / (0.6 * q23 + Math.log(1 + q3));
  };

  function starGeometry() {
    const qs = state.starMass, mHole = 0.5, mStar = qs * mHole, M = mHole + mStar;
    const a = STAR_SEP;
    const radius = 0.85 * a * rocheLobe(qs);
    // Inner Lagrange point, measured from the hole (Plavec and Kratochvil's fit).
    const l1 = a * (0.5 - 0.227 * Math.log10(qs));
    // The star's tip reaches L1; the disk is cut off by the hole's own Roche lobe.
    const stretch = Math.min(Math.max((a - l1) / radius, 1), 1.7);
    const diskOut = Math.max(0.75 * a * rocheLobe(1 / qs), 4.5);
    // Main-sequence temperature, roughly T ~ M^0.55, for a 10 solar-mass hole.
    const temp = Math.min(5800 * Math.pow(qs * 10, 0.55), 35000);
    return { mHole, mStar, M, a, radius, l1, stretch, diskOut, temp };
  }

  function starScene() {
    const g = starGeometry();
    const c = Math.cos(starSys.phase), s = Math.sin(starSys.phase);
    const hole = [-g.a * g.mStar / g.M * c, 0, -g.a * g.mStar / g.M * s];
    const star = [g.a * g.mHole / g.M * c, 0, g.a * g.mHole / g.M * s];
    const u = [c, 0, s];          // hole to star
    const w = [-s, 0, c];         // the direction the orbit moves in
    // The stream falls from L1 and the Coriolis force swings it forward, onto the disk's rim.
    const stream = [];
    const rim = g.diskOut * 0.85;
    for (let i = 0; i < 8; i++) {
      // Points 0-5 fall from L1 to the hot spot on the rim; 6-7 carry on round with the disk.
      const t = Math.min(i / 5, 1);
      const r = i <= 5 ? g.l1 + (rim - g.l1) * Math.pow(t, 0.75) : rim * (1 - 0.04 * (i - 5));
      const ang = i <= 5 ? 0.95 * Math.pow(t, 1.4) : 0.95 + 0.3 * (i - 5);
      const ca = Math.cos(ang), sa = Math.sin(ang);
      stream.push(hole[0] + r * (ca * u[0] + sa * w[0]), 0, hole[2] + r * (ca * u[2] + sa * w[2]));
    }
    return {
      a: [...hole, 1], b: [0, 0, 0, 0], mass: g.mHole, diskIn: 3, diskOut: g.diskOut,
      diskCenter: hole,
      star: [...star, g.radius], starShape: [-c, 0, -s, g.stretch], starTemp: g.temp,
      stream, streamReach: g.l1,
      // A heavier star raises stronger tides, and stronger arms.
      armStrength: 0.5 + 0.5 * Math.min(state.starMass, 1.5) / 1.5,
    };
  }

  function starStatusText() {
    const g = starGeometry();
    const period = 2 * Math.PI * Math.sqrt(g.a ** 3 / g.M) / TIME_SCALE / STAR_ORBIT_SPEEDUP;
    const temp = Math.round(g.temp / 500) * 500;
    return `${temp.toLocaleString()} K star, filling its Roche lobe · orbit ${period.toFixed(0)} s (sped up)`;
  }

  const NO_EXTRAS = {
    diskCenter: [0, 0, 0], star: [0, 0, 0, 0], starShape: [1, 0, 0, 1], starTemp: 5800,
    stream: new Array(24).fill(0), streamReach: 0, armStrength: 0,
  };

  function holes() {
    if (state.mode === 'star') return starScene();
    return { ...NO_EXTRAS, ...binaryHoles() };
  }

  function binaryHoles() {
    if (state.mode === 'single') return { a: [0, 0, 0, 1], b: [0, 0, 0, 0], mass: 0.5, diskIn: 3 };
    const b = binary;
    if (b.merged) {
      // A brief, small ringdown wobble in the horizon size as the new hole settles.
      const ring = 0.05 * Math.exp(-b.sinceMerge / 4) * Math.cos(b.mergeOmega * 1.6 * b.sinceMerge);
      return { a: [0, 0, 0, 1 + ring], b: [0, 0, 0, 0], mass: 0.5, diskIn: b.diskIn };
    }
    const M = b.m1 + b.m2;
    const c = Math.cos(b.phase), s = Math.sin(b.phase);
    // Positions about the centre of mass, orbiting in the disk plane.
    const r1 = b.sep * b.m2 / M, r2 = b.sep * b.m1 / M;
    return {
      a: [-r1 * c, 0, -r1 * s, 2 * b.m1],
      b: [r2 * c, 0, r2 * s, 2 * b.m2],
      mass: M,
      diskIn: b.diskIn,
    };
  }

  function statusText() {
    const b = binary;
    if (b.merged) return `Merged · ${Math.round(RADIATED * 100)}% of the mass left as gravitational waves`;
    const M = b.m1 + b.m2;
    const period = 2 * Math.PI * Math.sqrt(b.sep ** 3 / M) / TIME_SCALE;
    return `Inspiral · separation ${b.sep.toFixed(2)} rs · orbit ${period.toFixed(1)} s`;
  }

  const wave = new Float32Array(600);
  let waveHead = 0;
  const waveCanvas = $('waveCanvas');
  const wctx = waveCanvas.getContext('2d');

  function drawWave() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.round(waveCanvas.clientWidth * dpr), h = Math.round(waveCanvas.clientHeight * dpr);
    if (waveCanvas.width !== w || waveCanvas.height !== h) { waveCanvas.width = w; waveCanvas.height = h; }
    wctx.clearRect(0, 0, w, h);
    wctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
    wctx.lineWidth = dpr;
    wctx.beginPath(); wctx.moveTo(0, h / 2); wctx.lineTo(w, h / 2); wctx.stroke();
    // Scale so the strain at merger nearly fills the chart.
    const peak = binary.m1 * binary.m2 / (2 * (binary.m1 + binary.m2));
    wctx.strokeStyle = '#ffb054';
    wctx.lineWidth = 1.5 * dpr;
    wctx.beginPath();
    for (let i = 0; i < wave.length; i++) {
      const v = wave[(waveHead + i) % wave.length];
      const x = i / (wave.length - 1) * w;
      const y = h / 2 - Math.max(-1, Math.min(1, v / peak)) * (h / 2 - 2 * dpr);
      i ? wctx.lineTo(x, y) : wctx.moveTo(x, y);
    }
    wctx.stroke();
  }

  function setMode(mode) {
    state.mode = mode;
    const isBinary = mode === 'binary';
    $('binaryControls').hidden = !isBinary;
    $('wave').hidden = !isBinary;
    $('starControls').hidden = mode !== 'star';
    // The star system is wider than the others, so step back to see all of it.
    if (mode === 'star' && state.dist < 42) setDist(42);
    resetBinary();
  }
  for (const id of ['modeSingle', 'modeBinary', 'modeStar'])
    $(id).addEventListener('change', (e) => { if (e.target.checked) setMode(e.target.value); });
  $('restart').addEventListener('click', resetBinary);
  $('q').addEventListener('change', resetBinary);
  resetBinary();

  // Music is on by default. Browsers block sound until the visitor interacts,
  // so if playing right away is refused, it starts on the first click or key press.
  const track = $('track');
  track.volume = 0.5;
  const musicButton = $('music');
  let musicOn = true;
  const showMusic = () => {
    musicButton.setAttribute('aria-pressed', String(musicOn));
    musicButton.textContent = musicOn ? '♪ On' : '♪ Off';
  };
  const playIfOn = () => { if (musicOn && track.paused) track.play().catch(() => {}); };
  musicButton.addEventListener('click', () => {
    musicOn = !musicOn;
    if (musicOn) playIfOn(); else track.pause();
    showMusic();
  });
  // On touch screens a tap only counts once the finger lifts, so listen for that too.
  const unlockEvents = ['pointerdown', 'pointerup', 'touchend', 'keydown'];
  const unlock = () => {
    playIfOn();
    if (!track.paused || !musicOn) for (const t of unlockEvents) document.removeEventListener(t, unlock);
  };
  for (const t of unlockEvents) document.addEventListener(t, unlock);
  playIfOn();

  $('toggle').addEventListener('click', () => {
    const panel = $('panel');
    panel.classList.toggle('collapsed');
    $('toggle').textContent = panel.classList.contains('collapsed') ? '+' : '–';
  });

  // Orbit controls: one finger or the mouse drags to orbit; two fingers pinch to zoom.
  const pointers = new Map();
  let pinch = null;
  const dragging = () => pointers.size > 0;
  const fingerSpacing = () => {
    const [a, b] = [...pointers.values()];
    return Math.hypot(a.x - b.x, a.y - b.y);
  };
  function setDist(d) {
    state.dist = Math.max(6, Math.min(60, d));
    $('dist').value = state.dist;
    $('distOut').textContent = sliders.dist(state.dist);
  }
  canvas.addEventListener('pointerdown', (e) => {
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    canvas.setPointerCapture(e.pointerId);
    canvas.classList.add('dragging');
    if (pointers.size === 2) pinch = { spacing: fingerSpacing(), dist: state.dist };
  });
  canvas.addEventListener('pointermove', (e) => {
    const prev = pointers.get(e.pointerId);
    if (!prev) return;
    const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch) {
      // Spreading the fingers apart moves the camera closer.
      const spacing = fingerSpacing();
      if (spacing > 0) setDist(pinch.dist * pinch.spacing / spacing);
      return;
    }
    state.yaw -= dx * 0.005;
    state.incl = Math.max(-89, Math.min(89, state.incl + dy * 0.25));
    $('incl').value = state.incl;
    $('inclOut').textContent = sliders.incl(state.incl);
  });
  const endPointer = (e) => {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinch = null;
    if (pointers.size === 2) pinch = { spacing: fingerSpacing(), dist: state.dist };
    if (!pointers.size) canvas.classList.remove('dragging');
  };
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    setDist(state.dist * Math.exp(e.deltaY * 0.001));
  }, { passive: false });
  // Safari fires its own pinch gestures; keep them from zooming the whole page.
  for (const t of ['gesturestart', 'gesturechange'])
    document.addEventListener(t, (e) => e.preventDefault(), { passive: false });

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    // Size the drawing buffer to the canvas's own box, which can differ from the window on mobile.
    canvas.width = Math.max(1, Math.floor(canvas.clientWidth * dpr));
    canvas.height = Math.max(1, Math.floor(canvas.clientHeight * dpr));
    const w = Math.max(1, Math.floor(canvas.width * state.res));
    const h = Math.max(1, Math.floor(canvas.height * state.res));
    if (w === lowW && h === lowH) return;
    lowW = w; lowH = h;
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  }

  function cameraBasis() {
    const inc = state.incl * Math.PI / 180;
    const pos = [
      state.dist * Math.cos(inc) * Math.sin(state.yaw),
      state.dist * Math.sin(inc),
      state.dist * Math.cos(inc) * Math.cos(state.yaw),
    ];
    const len = Math.hypot(...pos);
    const fwd = pos.map((v) => -v / len);
    let right = [fwd[2], 0, -fwd[0]];
    const rl = Math.hypot(...right) || 1;
    right = right.map((v) => -v / rl);
    const up = [
      right[1] * fwd[2] - right[2] * fwd[1],
      right[2] * fwd[0] - right[0] * fwd[2],
      right[0] * fwd[1] - right[1] * fwd[0],
    ];
    // Column-major mat3 whose columns are right, up and forward.
    return { pos, rot: new Float32Array([...right, ...up, ...fwd]) };
  }

  function bindQuad(prog) {
    const a = gl.getAttribLocation(prog, 'aPos');
    gl.bindBuffer(gl.ARRAY_BUFFER, quad);
    gl.enableVertexAttribArray(a);
    gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0);
  }

  let simTime = 0, last = performance.now(), frames = 0, fpsAt = last, fps = 0;
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.1);
    last = now;
    simTime += dt * state.speed;
    if (state.mode === 'binary') {
      stepBinary(dt * state.speed * TIME_SCALE);
      wave[waveHead] = strain();
      waveHead = (waveHead + 1) % wave.length;
    }
    if (state.mode === 'star') {
      const g = starGeometry();
      starSys.phase += Math.sqrt(g.M / g.a ** 3) * dt * state.speed * TIME_SCALE * STAR_ORBIT_SPEEDUP;
    }
    const hs = holes();
    if (state.spin && !dragging()) state.yaw += dt * 0.05 * Math.max(state.speed, 0.2);
    resize();

    const cam = cameraBasis();

    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.viewport(0, 0, lowW, lowH);
    gl.useProgram(traceProg);
    bindQuad(traceProg);
    gl.uniform2f(U.uRes, lowW, lowH);
    gl.uniform1f(U.uTime, simTime);
    gl.uniform3fv(U.uCamPos, cam.pos);
    gl.uniformMatrix3fv(U.uCamRot, false, cam.rot);
    // A lone hole's disk starts at the innermost stable circular orbit, 3 rs;
    // around a binary the gas keeps clear of the orbit, leaving a wider cavity.
    gl.uniform1f(U.uDiskIn, hs.diskIn);
    gl.uniform1f(U.uDiskOut, hs.diskOut || Math.max(state.diskOuter, hs.diskIn + 5));
    gl.uniform3fv(U.uDiskCenter, hs.diskCenter);
    gl.uniform4fv(U.uStar, hs.star);
    gl.uniform4fv(U.uStarShape, hs.starShape);
    gl.uniform1f(U.uStarTemp, hs.starTemp);
    gl.uniform3fv(U.uStream, hs.stream);
    gl.uniform1f(U.uStreamReach, hs.streamReach);
    gl.uniform1f(U.uArmStrength, hs.armStrength);
    gl.uniform4fv(U.uHoleA, hs.a);
    gl.uniform4fv(U.uHoleB, hs.b);
    gl.uniform1f(U.uMass, hs.mass);
    gl.uniform1f(U.uBright, state.bright);
    gl.uniform1f(U.uDoppler, state.doppler ? 1 : 0);
    gl.uniform1f(U.uLensing, state.lensing ? 1 : 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.useProgram(blitProg);
    bindQuad(blitProg);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.uniform1i(loc(blitProg, 'uTex'), 0);
    gl.uniform2f(loc(blitProg, 'uRes'), canvas.width, canvas.height);
    gl.drawArrays(gl.TRIANGLES, 0, 3);

    frames++;
    if (now - fpsAt > 500) {
      fps = frames * 1000 / (now - fpsAt);
      frames = 0; fpsAt = now;
      $('stats').textContent = `${fps.toFixed(0)} fps · ${lowW}×${lowH} rays`;
    }
    if (state.mode === 'binary') {
      $('status').textContent = statusText();
      drawWave();
    }
    if (state.mode === 'star') $('starStatus').textContent = starStatusText();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
